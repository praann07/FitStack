<!DOCTYPE html>
<html>
  <body style="margin:0;padding:32px 16px;background-color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width:420px;background-color:#ffffff;border-radius:16px;padding:32px;" cellpadding="0" cellspacing="0">
            <tr>
              <td align="center" style="font-size:18px;font-weight:700;color:#0a0a0a;padding-bottom:4px;">
                FitStack
              </td>
            </tr>
            <tr>
              <td align="center" style="font-size:14px;color:#52525b;padding-bottom:24px;">
                Your verification code
              </td>
            </tr>
            <tr>
              <td align="center" style="font-size:36px;font-weight:700;letter-spacing:8px;color:#0a0a0a;padding:16px 0;">
                {{ .Token }}
              </td>
            </tr>
            <tr>
              <td align="center" style="font-size:13px;color:#71717a;padding-top:16px;line-height:1.5;">
                Enter this code on the sign-in screen to continue. It expires in 10 minutes.
                <br />
                If you didn't request this, you can safely ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
